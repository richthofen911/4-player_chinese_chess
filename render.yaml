# Render Blueprint —— 单实例 Node Web 服务（HTTP 静态页 + WebSocket 对局）
# 房间/对局状态保存在进程内存中，因此必须保持单实例（不要开启横向扩容）。
services:
  - type: web
    name: chunqiu-siguo-xiangqi
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
